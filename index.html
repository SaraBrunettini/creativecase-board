<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative jobs in Europe</title>
<meta name="description" content="Design, brand, content and research roles across Europe, read from company career pages. Updated daily.">
<style>
:root{
  --bg:#f3f4f6; --card:#fff; --ink:#111827; --muted:#6b7280; --faint:#9ca3af;
  --line:#e5e7eb; --link:#1d4ed8; --chip:#f3f4f6; --hover:#f9fafb;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1114; --card:#171a1f; --ink:#e7e9ec; --muted:#9aa2ad; --faint:#6b7280;
  --line:#272b32; --link:#7aa2f7; --chip:#20242b; --hover:#1c2026;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}

.topbar{background:var(--card);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1100px;margin:0 auto;padding:14px 20px}
h1{font-size:1.05rem;font-weight:600;margin:0 0 12px}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input,.search select{
  background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:9px 11px;font:inherit;color:inherit;min-width:0}
.search input{flex:1 1 260px}
.search select{flex:0 1 200px}

.page{max-width:1100px;margin:0 auto;padding:20px;display:grid;
  grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}

aside h2{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px}
aside .grp{margin-bottom:22px}
.fbtn{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;
  background:none;border:0;border-radius:5px;padding:5px 8px;font:inherit;color:inherit;cursor:pointer}
.fbtn:hover{background:var(--hover)}
.fbtn[aria-pressed=true]{background:var(--chip);font-weight:600}
.fbtn .n{color:var(--faint);font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:8px;padding:5px 8px;cursor:pointer}
.chk input{margin:0}

.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  flex-wrap:wrap;margin-bottom:12px}
.count{color:var(--muted);font-size:.9rem}
.head select{background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:6px 9px;font:inherit;font-size:.9rem;color:inherit}

.job{background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;margin-bottom:8px}
.job:hover{border-color:var(--faint)}
.job h3{margin:0;font-size:1rem;font-weight:600;line-height:1.35}
.job h3 a{color:var(--link);text-decoration:none}
.job h3 a:hover{text-decoration:underline}
.co{margin:2px 0 0;font-size:.92rem}
.loc{margin:1px 0 0;color:var(--muted);font-size:.9rem}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.tag{background:var(--chip);border-radius:4px;padding:2px 8px;font-size:.78rem;color:var(--muted)}
.date{color:var(--faint);font-size:.8rem;margin-left:auto}

.note{background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:40px 20px;text-align:center;color:var(--muted)}
footer{max-width:1100px;margin:0 auto;padding:8px 20px 40px;color:var(--faint);font-size:.82rem}
footer p{margin:4px 0}

@media(max-width:760px){
  .page{grid-template-columns:1fr;gap:16px}
  aside{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  aside .grp{margin-bottom:14px}
  .date{margin-left:0;width:100%}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="in">
    <h1>Creative jobs in Europe</h1>
    <div class="search">
      <input type="search" id="q" placeholder="Job title or company" aria-label="Job title or company">
      <select id="loc" aria-label="Location"><option value="">All locations</option></select>
    </div>
  </div>
</div>

<div class="page">
  <aside>
    <div class="grp">
      <h2>Discipline</h2>
      <div id="discs"></div>
    </div>
    <div class="grp">
      <h2>Filters</h2>
      <label class="chk"><input type="checkbox" id="rem"> Remote only</label>
      <label class="chk"><input type="checkbox" id="fresh"> Posted this month</label>
    </div>
  </aside>

  <main>
    <div class="head">
      <span class="count" id="count"></span>
      <select id="sort" aria-label="Sort by">
        <option value="new">Most recent</option>
        <option value="company">Company A-Z</option>
        <option value="title">Job title A-Z</option>
      </select>
    </div>
    <div id="list"><p class="note">Loading...</p></div>
  </main>
</div>

<footer>
  <p id="updated"></p>
  <p>Roles are read from each company's own careers feed and link to the original posting. No account, no tracking.</p>
</footer>

<script>
const $ = s => document.querySelector(s);
const state = { jobs: [], disc: '', q: '', loc: '', sort: 'new', remote: false, fresh: false };

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function days(d){
  if (!d) return null;
  const n = Math.floor((Date.now() - new Date(d)) / 864e5);
  return Number.isFinite(n) && n >= 0 ? n : null;
}
function ago(d){
  const n = days(d);
  if (n === null) return '';
  if (n === 0) return 'Today';
  if (n === 1) return 'Yesterday';
  if (n < 7) return n + ' days ago';
  if (n < 14) return '1 week ago';
  if (n < 60) return Math.floor(n / 7) + ' weeks ago';
  return Math.floor(n / 30) + ' months ago';
}

function place(loc){
  const l = (loc || '').toLowerCase();
  for (const [name, re] of [
    ['London',         /london/],
    ['United Kingdom', /\b(uk|united kingdom|england|scotland|wales|manchester|bristol|edinburgh|glasgow|cambridge|oxford|leeds|brighton|cardiff)\b/],
    ['Ireland',        /\b(dublin|ireland)\b/],
    ['Germany',        /\b(berlin|munich|hamburg|frankfurt|cologne|germany|deutschland)\b/],
    ['France',         /\b(paris|france|lyon|bordeaux|marseille|nantes)\b/],
    ['Netherlands',    /\b(amsterdam|rotterdam|utrecht|netherlands)\b/],
    ['Spain',          /\b(madrid|barcelona|spain)\b/],
    ['Portugal',       /\b(lisbon|porto|portugal)\b/],
    ['Poland',         /\b(warsaw|warszawa|krak|poland)\b/],
    ['Denmark',        /\b(copenhagen|denmark)\b/],
    ['Sweden',         /\b(stockholm|sweden)\b/],
    ['Switzerland',    /\b(zurich|geneva|switzerland)\b/],
    ['Belgium',        /\b(brussels|belgium)\b/],
  ]) if (re.test(l)) return name;
  if (/remote/.test(l)) return 'Remote';
  return 'Other';
}

function match(){
  let out = state.jobs.slice();
  if (state.disc)   out = out.filter(j => j.discipline === state.disc);
  if (state.loc)    out = out.filter(j => place(j.location) === state.loc);
  if (state.remote) out = out.filter(j => j.remote);
  if (state.fresh)  out = out.filter(j => { const n = days(j.posted); return n !== null && n <= 31; });
  if (state.q){
    const q = state.q.toLowerCase();
    out = out.filter(j => (j.title + ' ' + j.company).toLowerCase().includes(q));
  }
  if (state.sort === 'company') out.sort((a,b) => a.company.localeCompare(b.company));
  if (state.sort === 'title')   out.sort((a,b) => a.title.localeCompare(b.title));
  return out;
}

function drawFilters(){
  // Counts reflect every filter except the discipline one itself.
  const keep = state.disc; state.disc = '';
  const pool = match(); state.disc = keep;
  const n = {}; pool.forEach(j => n[j.discipline] = (n[j.discipline] || 0) + 1);
  const rows = [['All roles', '', pool.length],
    ...Object.keys(n).sort().map(d => [d, d, n[d]])];
  $('#discs').innerHTML = rows.map(([label, val, c]) =>
    `<button class="fbtn" data-d="${esc(val)}" aria-pressed="${val === state.disc}">
       <span>${esc(label)}</span><span class="n">${c}</span></button>`).join('');
}

function render(){
  const list = match();
  drawFilters();

  $('#count').textContent = list.length === 1 ? '1 job' : list.length + ' jobs';

  $('#list').innerHTML = list.length ? list.map(j => `
    <article class="job">
      <h3><a href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">${esc(j.title)}</a></h3>
      <p class="co">${esc(j.company)}</p>
      <p class="loc">${esc(j.location)}</p>
      <div class="tags">
        <span class="tag">${esc(j.discipline)}</span>
        ${j.remote ? '<span class="tag">Remote</span>' : ''}
        ${ago(j.posted) ? `<span class="date">${esc(ago(j.posted))}</span>` : ''}
      </div>
    </article>`).join('')
    : '<p class="note">No jobs match these filters.</p>';
}

fetch('jobs.json?' + Date.now())
  .then(r => r.json())
  .then(d => {
    state.jobs = d.jobs || [];

    const places = [...new Set(state.jobs.map(j => place(j.location)))]
      .sort((a,b) => a === 'Other' ? 1 : b === 'Other' ? -1 : a.localeCompare(b));
    $('#loc').innerHTML = '<option value="">All locations</option>' +
      places.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');

    $('#updated').textContent =
      `${d.count} jobs from ${d.companies} companies. Last updated ${(ago(d.updated) || 'today').toLowerCase()}.`;

    render();
  })
  .catch(() => { $('#list').innerHTML = '<p class="note">Could not load jobs. Please try again later.</p>'; });

$('#discs').addEventListener('click', e => {
  const b = e.target.closest('.fbtn'); if (!b) return;
  state.disc = b.dataset.d; render();
});
$('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('#loc').addEventListener('change', e => { state.loc = e.target.value; render(); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
$('#rem').addEventListener('change', e => { state.remote = e.target.checked; render(); });
$('#fresh').addEventListener('change', e => { state.fresh = e.target.checked; render(); });
</script>
</body>
</html>
